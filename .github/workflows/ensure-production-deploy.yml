# Vercel dropped a main commit on 24 Nov 2026.
# PR #82 (98cb5af) and PR #81 (3d11c7b) merged 12 seconds apart.
# Vercel built #82 and never created a deployment for #81, so production
# stayed on 98cb5af while GitHub main had moved on.
#
# This job runs after every push to main. When VERCEL_TOKEN is set, it waits
# for a READY production deployment of that exact SHA and, if the Git
# integration skipped the commit, deploys it with the Vercel CLI.
#
# Without VERCEL_TOKEN the job warns and exits successfully. Add the secret
# (deploy access for prj_UaEpJG9sPUDNGtrxsKmNV6LBwIrx on team
# team_s96Q6VsOZlu15m700MS0XMHs) so a missed production deploy can be repaired
# automatically. Until then, confirm the production SHA by hand after each
# main merge.

name: Ensure production deployment

on:
  push:
    branches: [main]

jobs:
  production-sha:
    name: Production deploy matches main
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require a Vercel token for auto-repair
        id: token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_TOKEN is not set. This job cannot confirm or repair the production SHA. After each main merge, open Vercel and confirm a READY production deployment whose SHA equals the merge commit. Add VERCEL_TOKEN under GitHub Actions secrets to enable auto-repair."
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - name: Confirm production is serving this commit
        if: steps.token.outputs.present == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_s96Q6VsOZlu15m700MS0XMHs
          VERCEL_PROJECT_ID: prj_UaEpJG9sPUDNGtrxsKmNV6LBwIrx
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          match() {
            curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&target=production&limit=20" \
              | jq -e --arg sha "$SHA" '
                  [.deployments[]
                    | select(.state == "READY")
                    | select(.meta.githubCommitSha == $sha or .meta.gitCommitSha == $sha)
                  ] | length > 0
                ' >/dev/null
          }
          for i in 1 2 3 4 5 6; do
            if match; then
              echo "Production is serving $SHA"
              exit 0
            fi
            echo "No READY production deployment for $SHA yet ($i/6)"
            sleep 30
          done
          echo "Git integration missed $SHA. Deploying this commit to production."
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel deploy --prod --yes --token="$VERCEL_TOKEN" --meta "githubCommitSha=$SHA"
          for i in 1 2 3 4 5 6 7 8; do
            if match; then
              echo "Production is serving $SHA"
              exit 0
            fi
            echo "Waiting for the CLI deployment to become READY ($i/8)"
            sleep 30
          done
          echo "::error::Production is still not serving $SHA. Promote that commit in Vercel before treating the merge as live."
          exit 1
